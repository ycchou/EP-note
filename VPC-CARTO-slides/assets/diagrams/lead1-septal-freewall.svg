<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" font-family="'Inter','Noto Sans TC',sans-serif">
  <defs>
    <radialGradient id="heartFill" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0" stop-color="#3a4a5c"/>
      <stop offset="1" stop-color="#1a2944"/>
    </radialGradient>
    <marker id="arrL" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#F39200"/>
    </marker>
    <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#FB7185"/>
    </marker>
    <marker id="arrLead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#16B8C7"/>
    </marker>
  </defs>

  <text x="450" y="38" fill="#fff" font-weight="800" font-size="22" text-anchor="middle">Lead I · 區分 Septal vs Free wall</text>

  <!-- Heart cross-section (very simplified) -->
  <g transform="translate(220,90)">
    <!-- LV chamber outline -->
    <ellipse cx="200" cy="160" rx="180" ry="140" fill="url(#heartFill)" stroke="#7A8499" stroke-width="2"/>

    <!-- IV septum -->
    <line x1="200" y1="40" x2="200" y2="300" stroke="#F39200" stroke-width="3" stroke-dasharray="6 4"/>
    <text x="208" y="55" fill="#F39200" font-size="13" font-weight="700">IV septum</text>

    <!-- RV label (left side of image) -->
    <text x="100" y="170" fill="#7A8499" font-size="14" font-weight="600">RV</text>
    <text x="290" y="170" fill="#7A8499" font-size="14" font-weight="600">LV</text>

    <!-- Septal origin -->
    <circle cx="200" cy="160" r="10" fill="#F39200"/>
    <text x="200" y="135" fill="#F39200" font-size="13" font-weight="700" text-anchor="middle">Septal origin</text>
    <!-- arrow from septal origin going LEFT (toward LV free wall, same as Lead I direction) -->
    <line x1="210" y1="160" x2="340" y2="160" stroke="#F39200" stroke-width="3" marker-end="url(#arrL)"/>
    <text x="275" y="183" fill="#F39200" font-size="11" font-weight="600" text-anchor="middle">右 → 左 朝向 Lead I</text>

    <!-- Free wall origin -->
    <circle cx="370" cy="220" r="10" fill="#FB7185"/>
    <text x="370" y="248" fill="#FB7185" font-size="13" font-weight="700" text-anchor="middle">Free wall origin</text>
    <!-- arrow from free wall going LEFT-DOWN-INWARD (away from Lead I direction) -->
    <line x1="360" y1="220" x2="240" y2="280" stroke="#FB7185" stroke-width="3" marker-end="url(#arrR)"/>
    <text x="300" y="305" fill="#FB7185" font-size="11" font-weight="600" text-anchor="middle">外側 → 內側 遠離 Lead I</text>

    <!-- Lead I vector indicator on left -->
    <g transform="translate(-180,140)">
      <text x="0" y="0" fill="#16B8C7" font-size="12" font-weight="700">Lead I 向量</text>
      <line x1="0" y1="15" x2="100" y2="15" stroke="#16B8C7" stroke-width="2.5" marker-end="url(#arrLead)"/>
      <text x="0" y="36" fill="#7A8499" font-size="11">右肩 → 左肩</text>
    </g>
  </g>

  <!-- Legend / interpretation table -->
  <g transform="translate(40,380)">
    <rect width="380" height="64" rx="10" fill="rgba(243,146,0,0.12)" stroke="#F39200" stroke-width="1.5"/>
    <text x="14" y="26" fill="#F39200" font-weight="800" font-size="14">Lead I 正向 → Septal site</text>
    <text x="14" y="48" fill="#B8C0D0" font-size="11">向量朝向 Lead I（右 → 左）</text>

    <g transform="translate(440,0)">
      <rect width="380" height="64" rx="10" fill="rgba(251,113,133,0.12)" stroke="#FB7185" stroke-width="1.5"/>
      <text x="14" y="26" fill="#FB7185" font-weight="800" font-size="14">Lead I 負向 / QS → Free wall site</text>
      <text x="14" y="48" fill="#B8C0D0" font-size="11">向量遠離 Lead I（外側 → 內側）</text>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="'Inter','Noto Sans TC',sans-serif" preserveAspectRatio="xMidYMid meet">
  <defs>
    <marker id="dt-arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8499"/>
    </marker>
    <linearGradient id="dt-diam" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1A3A7A"/>
      <stop offset="1" stop-color="#0B1E3F"/>
    </linearGradient>
  </defs>

  <text x="640" y="40" fill="#fff" font-weight="800" font-size="24" text-anchor="middle">VPC Decision Tree · 4 個分岔點</text>

  <!-- Root -->
  <g transform="translate(570,70)">
    <rect width="140" height="50" rx="25" fill="#F39200"/>
    <text x="70" y="32" fill="#0B1E3F" font-weight="800" font-size="15" text-anchor="middle">VPC 出現</text>
  </g>

  <!-- Q1: clinical PVC -->
  <g transform="translate(490,160)">
    <polygon points="150,0 300,42 150,84 0,42" fill="url(#dt-diam)" stroke="#16B8C7" stroke-width="2"/>
    <text x="150" y="40" fill="#fff" font-weight="700" font-size="14" text-anchor="middle">是 clinical PVC？</text>
    <text x="150" y="60" fill="#16B8C7" font-size="11" text-anchor="middle">Pattern Matching 比對</text>
  </g>
  <line x1="640" y1="120" x2="640" y2="160" stroke="#7A8499" stroke-width="2" marker-end="url(#dt-arr)"/>

  <!-- Q1 branches -->
  <g transform="translate(80,270)">
    <rect width="300" height="56" rx="10" fill="#16223D" stroke="#4ADE80" stroke-width="2"/>
    <text x="14" y="22" fill="#4ADE80" font-weight="800" font-size="12">YES</text>
    <text x="14" y="44" fill="#fff" font-size="13">→ 收進 target LAT map</text>
  </g>
  <g transform="translate(900,270)">
    <rect width="300" height="56" rx="10" fill="#16223D" stroke="#FB7185" stroke-width="2"/>
    <text x="14" y="22" fill="#FB7185" font-weight="800" font-size="12">NO</text>
    <text x="14" y="44" fill="#fff" font-size="13">→ APB 分到其他 morphology</text>
  </g>
  <line x1="500" y1="200" x2="240" y2="270" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>
  <line x1="780" y1="200" x2="1050" y2="270" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>

  <!-- Q2: frequency -->
  <g transform="translate(490,360)">
    <polygon points="150,0 300,42 150,84 0,42" fill="url(#dt-diam)" stroke="#FFD166" stroke-width="2"/>
    <text x="150" y="40" fill="#fff" font-weight="700" font-size="14" text-anchor="middle">VPC 頻繁嗎？</text>
    <text x="150" y="60" fill="#FFD166" font-size="11" text-anchor="middle">Baseline observation</text>
  </g>
  <line x1="230" y1="326" x2="540" y2="360" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>

  <g transform="translate(80,470)">
    <rect width="300" height="60" rx="10" fill="#16223D" stroke="#C8102E" stroke-width="2"/>
    <text x="14" y="22" fill="#FB7185" font-weight="800" font-size="12">FREQUENT</text>
    <text x="14" y="42" fill="#fff" font-size="13">→ LAT Hybrid activation</text>
    <text x="14" y="56" fill="#7A8499" font-size="11">收最早 activation site</text>
  </g>
  <g transform="translate(900,470)">
    <rect width="300" height="60" rx="10" fill="#16223D" stroke="#7C5CFF" stroke-width="2"/>
    <text x="14" y="22" fill="#B4A0FF" font-weight="800" font-size="12">INFREQUENT</text>
    <text x="14" y="42" fill="#fff" font-size="13">→ PASO 主導</text>
    <text x="14" y="56" fill="#7A8499" font-size="11">+ anatomy + limited LAT</text>
  </g>
  <line x1="540" y1="402" x2="240" y2="470" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>
  <line x1="740" y1="402" x2="1050" y2="470" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>

  <!-- Q3: LAT早 + PASO 高 -->
  <g transform="translate(490,560)">
    <polygon points="150,0 300,42 150,84 0,42" fill="url(#dt-diam)" stroke="#16B8C7" stroke-width="2"/>
    <text x="150" y="44" fill="#fff" font-weight="700" font-size="14" text-anchor="middle">LAT 夠早 + PASO 高？</text>
  </g>
  <line x1="230" y1="530" x2="540" y2="560" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>
  <line x1="1050" y1="530" x2="740" y2="560" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>

  <g transform="translate(80,675)">
    <rect width="300" height="32" rx="10" fill="#4ADE80"/>
    <text x="150" y="22" fill="#0B1E3F" font-weight="800" font-size="13" text-anchor="middle">YES → RF Ablation</text>
  </g>
  <g transform="translate(900,675)">
    <rect width="300" height="32" rx="10" fill="#FB7185"/>
    <text x="150" y="22" fill="#0B1E3F" font-weight="800" font-size="13" text-anchor="middle">NO → 換 chamber / opposite side</text>
  </g>
  <line x1="540" y1="610" x2="240" y2="675" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>
  <line x1="740" y1="610" x2="1050" y2="675" stroke="#7A8499" stroke-width="1.5" marker-end="url(#dt-arr)"/>
</svg>

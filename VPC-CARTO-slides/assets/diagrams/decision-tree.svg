<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" font-family="'Inter','Noto Sans TC',sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#7A8499"/>
    </marker>
    <linearGradient id="diam" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1A3A7A"/>
      <stop offset="1" stop-color="#0B1E3F"/>
    </linearGradient>
  </defs>

  <text x="600" y="36" fill="#fff" font-weight="800" font-size="22" text-anchor="middle">VPC Decision Tree · 每個分岔點該怎麼選</text>

  <!-- Root -->
  <g transform="translate(540,70)">
    <rect width="120" height="48" rx="24" fill="#F39200"/>
    <text x="60" y="30" fill="#0B1E3F" font-weight="800" font-size="14" text-anchor="middle">VPC 出現</text>
  </g>

  <!-- Q1 -->
  <g transform="translate(450,150)">
    <polygon points="150,0 300,40 150,80 0,40" fill="url(#diam)" stroke="#16B8C7" stroke-width="1.5"/>
    <text x="150" y="38" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">是 clinical PVC？</text>
    <text x="150" y="56" fill="#16B8C7" font-size="11" text-anchor="middle">Pattern Matching 比對</text>
  </g>
  <line x1="600" y1="118" x2="600" y2="150" stroke="#7A8499" stroke-width="2" marker-end="url(#arr)"/>

  <!-- Yes / No branches Q1 -->
  <g transform="translate(60,260)">
    <rect width="280" height="60" rx="10" fill="#16223D" stroke="#4ADE80"/>
    <text x="14" y="24" fill="#4ADE80" font-weight="700" font-size="12">YES</text>
    <text x="14" y="46" fill="#fff" font-size="13">→ 收進 LAT map</text>
  </g>
  <g transform="translate(860,260)">
    <rect width="280" height="60" rx="10" fill="#16223D" stroke="#FB7185"/>
    <text x="14" y="24" fill="#FB7185" font-weight="700" font-size="12">NO</text>
    <text x="14" y="46" fill="#fff" font-size="13">→ APB 分到其他 morphology</text>
  </g>
  <line x1="450" y1="190" x2="200" y2="260" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="750" y1="190" x2="1000" y2="260" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Q2 -->
  <g transform="translate(450,360)">
    <polygon points="150,0 300,40 150,80 0,40" fill="url(#diam)" stroke="#FFD166" stroke-width="1.5"/>
    <text x="150" y="38" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">VPC 頻繁嗎？</text>
    <text x="150" y="56" fill="#FFD166" font-size="11" text-anchor="middle">Baseline observation</text>
  </g>
  <line x1="200" y1="320" x2="500" y2="360" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(60,470)">
    <rect width="280" height="64" rx="10" fill="#16223D" stroke="#C8102E" stroke-width="1.5"/>
    <text x="14" y="22" fill="#FB7185" font-weight="700" font-size="12">FREQUENT</text>
    <text x="14" y="42" fill="#fff" font-size="13">→ LAT Hybrid activation</text>
    <text x="14" y="58" fill="#7A8499" font-size="11">收最早 activation</text>
  </g>
  <g transform="translate(860,470)">
    <rect width="280" height="64" rx="10" fill="#16223D" stroke="#7C5CFF" stroke-width="1.5"/>
    <text x="14" y="22" fill="#B4A0FF" font-weight="700" font-size="12">INFREQUENT</text>
    <text x="14" y="42" fill="#fff" font-size="13">→ PASO 主導</text>
    <text x="14" y="58" fill="#7A8499" font-size="11">+ anatomy + limited LAT</text>
  </g>
  <line x1="500" y1="400" x2="220" y2="470" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="400" x2="980" y2="470" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Q3 -->
  <g transform="translate(450,580)">
    <polygon points="150,0 300,40 150,80 0,40" fill="url(#diam)" stroke="#16B8C7" stroke-width="1.5"/>
    <text x="150" y="38" fill="#fff" font-weight="700" font-size="13" text-anchor="middle">LAT 夠早 + PASO 高？</text>
  </g>
  <line x1="200" y1="534" x2="500" y2="580" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="1000" y1="534" x2="700" y2="580" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>

  <g transform="translate(60,690)">
    <rect width="280" height="22" rx="10" fill="#4ADE80"/>
    <text x="140" y="16" fill="#0B1E3F" font-weight="800" font-size="12" text-anchor="middle">YES → RF Ablation</text>
  </g>
  <g transform="translate(860,690)">
    <rect width="280" height="22" rx="10" fill="#FB7185"/>
    <text x="140" y="16" fill="#0B1E3F" font-weight="800" font-size="12" text-anchor="middle">NO → 換 chamber / opposite side</text>
  </g>
  <line x1="500" y1="620" x2="220" y2="690" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="700" y1="620" x2="980" y2="690" stroke="#7A8499" stroke-width="1.5" marker-end="url(#arr)"/>
</svg>

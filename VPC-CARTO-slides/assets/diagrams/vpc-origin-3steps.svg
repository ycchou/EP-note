<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" font-family="'Inter','Noto Sans TC',sans-serif">
  <defs>
    <linearGradient id="card1" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#16223D"/>
      <stop offset="1" stop-color="#0B1E3F"/>
    </linearGradient>
  </defs>

  <text x="550" y="38" fill="#fff" font-weight="800" font-size="24" text-anchor="middle">VPC Origin · 三步驟向量定位</text>
  <text x="550" y="60" fill="#7A8499" font-size="12" text-anchor="middle">不死記解剖 · V1 判左右 → 下壁判上下 → Transition 定 OT</text>

  <!-- Step 1 -->
  <g transform="translate(40,90)">
    <rect width="330" height="380" rx="16" fill="url(#card1)" stroke="#F39200" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#F39200"/>
    <text x="40" y="48" fill="#0B1E3F" font-weight="900" font-size="22" text-anchor="middle">1</text>
    <text x="76" y="38" fill="#fff" font-weight="800" font-size="16">分左右</text>
    <text x="76" y="56" fill="#F39200" font-size="12" font-weight="700">看 V1</text>

    <!-- LBBB trace -->
    <g transform="translate(20,90)">
      <text x="0" y="14" fill="#FB7185" font-weight="700" font-size="13">LBBB pattern → 右心室 RV</text>
      <text x="0" y="30" fill="#7A8499" font-size="11">V1 主要向下 (QS / rS)</text>
      <path d="M0,75 L40,75 L42,77 L46,85 L52,115 L58,70 L62,75 L290,75" fill="none" stroke="#FB7185" stroke-width="2"/>
    </g>

    <!-- RBBB trace -->
    <g transform="translate(20,230)">
      <text x="0" y="14" fill="#16B8C7" font-weight="700" font-size="13">RBBB pattern → 左心室 LV</text>
      <text x="0" y="30" fill="#7A8499" font-size="11">V1 主要向上 (R / rsR')</text>
      <path d="M0,75 L40,75 L44,73 L48,45 L54,70 L58,67 L62,75 L290,75" fill="none" stroke="#16B8C7" stroke-width="2"/>
    </g>
  </g>

  <!-- Step 2 -->
  <g transform="translate(390,90)">
    <rect width="330" height="380" rx="16" fill="url(#card1)" stroke="#FFD166" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#FFD166"/>
    <text x="40" y="48" fill="#0B1E3F" font-weight="900" font-size="22" text-anchor="middle">2</text>
    <text x="76" y="38" fill="#fff" font-weight="800" font-size="16">判上下</text>
    <text x="76" y="56" fill="#FFD166" font-size="12" font-weight="700">看 II / III / aVF</text>

    <!-- Inferior axis -->
    <g transform="translate(20,90)">
      <text x="0" y="14" fill="#4ADE80" font-weight="700" font-size="13">下壁全正 (Inferior Axis) → OT</text>
      <text x="0" y="30" fill="#7A8499" font-size="11">訊號由上往下 → 朝向下壁導程</text>
      <g stroke="#4ADE80" stroke-width="2" fill="none">
        <path d="M0,80 L32,80 L34,78 L40,48 L46,75 L52,80 L88,80"/>
        <text x="92" y="84" fill="#4ADE80" font-size="11">II</text>
        <path d="M108,80 L138,80 L140,78 L146,50 L152,75 L156,80 L188,80"/>
        <text x="192" y="84" fill="#4ADE80" font-size="11">III</text>
        <path d="M208,80 L234,80 L236,78 L242,52 L248,75 L252,80 L290,80"/>
      </g>
    </g>

    <!-- Superior axis -->
    <g transform="translate(20,230)">
      <text x="0" y="14" fill="#FB7185" font-weight="700" font-size="13">下壁全負 (Superior Axis) → Apex/下壁</text>
      <text x="0" y="30" fill="#7A8499" font-size="11">訊號由下往上 → 遠離下壁導程</text>
      <g stroke="#FB7185" stroke-width="2" fill="none">
        <path d="M0,80 L32,80 L34,82 L40,112 L46,85 L52,80 L88,80"/>
        <text x="92" y="84" fill="#FB7185" font-size="11">II</text>
        <path d="M108,80 L138,80 L140,82 L146,114 L152,85 L156,80 L188,80"/>
        <text x="192" y="84" fill="#FB7185" font-size="11">III</text>
        <path d="M208,80 L234,80 L236,82 L242,112 L248,85 L252,80 L290,80"/>
      </g>
    </g>
  </g>

  <!-- Step 3 -->
  <g transform="translate(740,90)">
    <rect width="330" height="380" rx="16" fill="url(#card1)" stroke="#16B8C7" stroke-width="2"/>
    <circle cx="40" cy="40" r="22" fill="#16B8C7"/>
    <text x="40" y="48" fill="#0B1E3F" font-weight="900" font-size="22" text-anchor="middle">3</text>
    <text x="76" y="38" fill="#fff" font-weight="800" font-size="16">定 OT 來源</text>
    <text x="76" y="56" fill="#16B8C7" font-size="12" font-weight="700">看 Transition Zone</text>

    <!-- Inner box 1: Transition Zone -->
    <g transform="translate(20,80)">
      <rect width="290" height="140" rx="10" fill="#0B1E3F" stroke="#16B8C7" stroke-opacity="0.6"/>
      <text x="14" y="26" fill="#16B8C7" font-weight="700" font-size="12">R/S &gt; 1 出現在...</text>
      <text x="14" y="54" fill="#fff" font-size="13">📍 V1–V2 早轉正</text>
      <text x="14" y="76" fill="#FFD166" font-weight="700" font-size="14">→ LVOT / Aortic cusp</text>
      <text x="14" y="104" fill="#fff" font-size="13">📍 V4 之後晚轉正</text>
      <text x="14" y="126" fill="#FB7185" font-weight="700" font-size="14">→ RVOT</text>
    </g>

    <!-- Inner box 2: Lead I -->
    <g transform="translate(20,235)">
      <rect width="290" height="135" rx="10" fill="#0B1E3F" stroke="#F39200" stroke-opacity="0.6"/>
      <text x="14" y="24" fill="#F39200" font-weight="700" font-size="12">Lead I 細分 septal / free wall</text>
      <text x="14" y="50" fill="#fff" font-size="13">📍 Lead I 正向 → Septal</text>
      <text x="14" y="68" fill="#7A8499" font-size="11">(右 → 左 朝向 lead I)</text>
      <text x="14" y="94" fill="#fff" font-size="13">📍 Lead I 負向 → Free wall</text>
      <text x="14" y="112" fill="#7A8499" font-size="11">(外側 → 內側 遠離 lead I)</text>
    </g>
  </g>
</svg>

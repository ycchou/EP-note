<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 360" font-family="'Inter','Noto Sans TC',sans-serif">
  <defs>
    <linearGradient id="ruler" x1="0" x2="1">
      <stop offset="0" stop-color="#C8102E"/>
      <stop offset="0.25" stop-color="#F39200"/>
      <stop offset="0.5" stop-color="#FFD166"/>
      <stop offset="0.75" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#16B8C7"/>
    </linearGradient>
  </defs>

  <text x="500" y="40" fill="#fff" font-weight="800" font-size="22" text-anchor="middle">LAT Hybrid · Bipolar EGM 提前 QRS Onset 多少 ms？</text>
  <text x="500" y="62" fill="#7A8499" font-size="12" text-anchor="middle">PVC QRS onset = time zero · 數字越負，越靠近 origin</text>

  <!-- Ruler -->
  <rect x="100" y="120" width="800" height="50" rx="8" fill="url(#ruler)"/>

  <!-- Tick marks + labels -->
  <g font-size="13" fill="#fff" text-anchor="middle">
    <line x1="100" y1="175" x2="100" y2="185" stroke="#fff" stroke-width="2"/>
    <text x="100" y="205" font-weight="700">-50 ms</text>
    <line x1="280" y1="175" x2="280" y2="185" stroke="#fff" stroke-width="2"/>
    <text x="280" y="205" font-weight="700">-40 ms</text>
    <line x1="460" y1="175" x2="460" y2="185" stroke="#fff" stroke-width="2"/>
    <text x="460" y="205" font-weight="700">-30 ms</text>
    <line x1="640" y1="175" x2="640" y2="185" stroke="#fff" stroke-width="2"/>
    <text x="640" y="205" font-weight="700">-20 ms</text>
    <line x1="820" y1="175" x2="820" y2="185" stroke="#fff" stroke-width="2"/>
    <text x="820" y="205" font-weight="700">-10 ms</text>
    <line x1="900" y1="175" x2="900" y2="185" stroke="#fff" stroke-width="2"/>
    <text x="900" y="205" font-weight="700" fill="#7A8499">QRS onset</text>
  </g>

  <!-- Labels above -->
  <text x="180" y="105" fill="#FB7185" font-weight="800" font-size="14" text-anchor="middle">非常可疑 origin</text>
  <text x="370" y="105" fill="#F39200" font-weight="800" font-size="14" text-anchor="middle">很有意義</text>
  <text x="550" y="105" fill="#FFD166" font-weight="700" font-size="13" text-anchor="middle">可能接近</text>
  <text x="730" y="105" fill="#7A8499" font-weight="600" font-size="13" text-anchor="middle">遠</text>

  <!-- Threshold callouts -->
  <g transform="translate(120,250)">
    <rect width="200" height="80" rx="10" fill="#C8102E" opacity="0.18" stroke="#FB7185" stroke-width="1.5"/>
    <text x="100" y="26" fill="#FB7185" font-weight="800" font-size="14" text-anchor="middle">≥ –40 ms</text>
    <text x="100" y="50" fill="#fff" font-size="12" text-anchor="middle">非常可疑 origin</text>
    <text x="100" y="68" fill="#B8C0D0" font-size="11" text-anchor="middle">配 unipolar QS 即下手</text>
  </g>

  <g transform="translate(340,250)">
    <rect width="200" height="80" rx="10" fill="#F39200" opacity="0.18" stroke="#F39200" stroke-width="1.5"/>
    <text x="100" y="26" fill="#F39200" font-weight="800" font-size="14" text-anchor="middle">–30 ms</text>
    <text x="100" y="50" fill="#fff" font-size="12" text-anchor="middle">很有意義</text>
    <text x="100" y="68" fill="#B8C0D0" font-size="11" text-anchor="middle">再用 PASO confirm</text>
  </g>

  <g transform="translate(560,250)">
    <rect width="200" height="80" rx="10" fill="#FFD166" opacity="0.18" stroke="#FFD166" stroke-width="1.5"/>
    <text x="100" y="26" fill="#FFD166" font-weight="800" font-size="14" text-anchor="middle">–20 ms</text>
    <text x="100" y="50" fill="#fff" font-size="12" text-anchor="middle">可能接近</text>
    <text x="100" y="68" fill="#B8C0D0" font-size="11" text-anchor="middle">繼續找更早點</text>
  </g>

  <g transform="translate(780,250)">
    <rect width="190" height="80" rx="10" fill="#16B8C7" opacity="0.10" stroke="#7A8499" stroke-width="1.5"/>
    <text x="95" y="26" fill="#16B8C7" font-weight="800" font-size="14" text-anchor="middle">unipolar QS</text>
    <text x="95" y="50" fill="#fff" font-size="12" text-anchor="middle">+ steep negative</text>
    <text x="95" y="68" fill="#B8C0D0" font-size="11" text-anchor="middle">支持 focal origin</text>
  </g>
</svg>
